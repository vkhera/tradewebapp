server:
  port: 8080
  compression:
    enabled: true
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 20000
    accept-count: 100

spring:
  application:
    name: stock-brokerage
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/stockdb
    username: ${DB_USER:stockuser}
    password: ${DB_PASS:stockpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000ms
    
  cache:
    type: redis
    redis:
      time-to-live: 600000
  
  # Task Scheduler Configuration
  # Ensures that concurrent @Scheduled jobs don't block each other
  task:
    scheduling:
      pool:
        size: 8                                          # 8 threads for concurrent scheduled jobs
      thread-name-prefix: batch-job-                    # Thread naming for debugging
      shutdown:
        await-termination: true
        await-termination-period: 60s

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.example.stockbrokerage: INFO
    org.hibernate.SQL: WARN
  # Console pattern includes traceId/spanId injected by Micrometer Tracing via MDC
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId:-},%X{spanId:-}] - %msg%n"
  # Plain text log (kept for compatibility); JSON log written by logback-spring.xml
  file:
    name: logs/stock-brokerage.log
    max-size: 10MB
    max-history: 30

# Data/log housekeeping
app:
  maintenance:
    stock-price-cache-retention:
      enabled: true
      days: 7
    tmp-log-cleanup:
      enabled: true
      older-than-days: 2
      log-dir: logs
  news-analysis:
    lookback-days: 5
    cron: "0 15 2 * * *"
    ollama:
      url: ${OLLAMA_CHAT_URL:http://localhost:11434/api/chat}
      fallback-url: ${OLLAMA_FALLBACK_URL:http://host.docker.internal:11434/api/chat}
      model: ${OLLAMA_MODEL:gemma3:1b}
      temperature: 0.2
      max-retries: ${OLLAMA_MAX_RETRIES:2}
      retry-delay-ms: ${OLLAMA_RETRY_DELAY_MS:350}
      connect-timeout-ms: ${OLLAMA_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${OLLAMA_READ_TIMEOUT_MS:15000}
  etf-dashboard:
    url: ${ETF_DASHBOARD_URL:http://localhost:8000}
    fallback-url: ${ETF_DASHBOARD_FALLBACK_URL:http://host.docker.internal:8000}
    lookback-days: 7
    max-retries: ${ETF_DASHBOARD_MAX_RETRIES:2}
    retry-delay-ms: ${ETF_DASHBOARD_RETRY_DELAY_MS:250}

# Management/Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: "*"            # expose all endpoints; restrict via security in prod
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  # Tag every metric with the application name for multi-service Grafana filtering
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  # Distributed tracing – sends spans to Tempo (Zipkin-compatible ingest on :9411)
  tracing:
    sampling:
      probability: 1.0          # 100 % sampling; lower to 0.1 in production
  # Distributed traces are sent to Tempo via Zipkin protocol.
  # When running locally:  Tempo on localhost:9411 (docker-compose.observability.yml)
  # When running in Docker: set TEMPO_HOST=host.docker.internal in docker-compose.yml
  zipkin:
    tracing:
      endpoint: "http://${TEMPO_HOST:localhost}:${TEMPO_ZIPKIN_PORT:9411}/api/v2/spans"

