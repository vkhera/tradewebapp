# ──────────────────────────────────────────────────────────────────────────────
# CORS: echo back the request Origin for localhost / 127.0.0.1 (any port)
# ──────────────────────────────────────────────────────────────────────────────
map $http_origin $cors_origin {
    default                                       "";
    "~^https?://(localhost|127\.0\.0\.1)(:\d+)?$" $http_origin;
}

# ──────────────────────────────────────────────────────────────────────────────
# HTTP – keep port 80 active (Let's Encrypt ACME challenge + direct access)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt webroot challenge (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Angular static files live here
    root /usr/share/nginx/html;
    index index.html;

    # ────────────────────────────────────────────
    # Proxy – Spring Boot REST API
    # ────────────────────────────────────────────
    location /api/ {
        # ── CORS preflight ───────────────────────
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'       always;
            add_header 'Access-Control-Allow-Methods'    'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'    'Authorization, Content-Type, Accept, X-Requested-With' always;
            add_header 'Access-Control-Max-Age'           86400        always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true'       always;
        add_header 'Access-Control-Allow-Methods'    'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'    'Authorization, Content-Type, Accept, X-Requested-With' always;
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;  # prediction calls can be slow
    }

    # ────────────────────────────────────────────
    # Proxy – Swagger UI (access at /swagger-ui/)
    # ────────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass       http://backend:8080/swagger-ui/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /swagger-ui.html {
        proxy_pass       http://backend:8080/swagger-ui.html;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    # ────────────────────────────────────────────
    # Proxy – OpenAPI JSON / YAML
    # ────────────────────────────────────────────
    location /api-docs {
        proxy_pass       http://backend:8080/api-docs;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    # ────────────────────────────────────────────
    # Proxy – Actuator (health checks etc.)
    # ────────────────────────────────────────────
    location /actuator/ {
        proxy_pass       http://backend:8080/actuator/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    # ────────────────────────────────────────────
    # Angular HTML5 history-mode routing fallback
    # ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}

# ──────────────────────────────────────────────────────────────────────────────
# HTTPS – port 443 with SSL (Let's Encrypt cert or self-signed fallback)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Angular static files live here
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # ── CORS preflight ───────────────────────
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'       always;
            add_header 'Access-Control-Allow-Methods'    'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'    'Authorization, Content-Type, Accept, X-Requested-With' always;
            add_header 'Access-Control-Max-Age'           86400        always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true'       always;
        add_header 'Access-Control-Allow-Methods'    'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'    'Authorization, Content-Type, Accept, X-Requested-With' always;
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
    }

    location /swagger-ui/ {
        proxy_pass       http://backend:8080/swagger-ui/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /swagger-ui.html {
        proxy_pass       http://backend:8080/swagger-ui.html;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    location /api-docs {
        proxy_pass       http://backend:8080/api-docs;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    location /actuator/ {
        proxy_pass       http://backend:8080/actuator/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
