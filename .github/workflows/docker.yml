name: Docker Images

on:
  pull_request:
    branches: [ main, develop ]
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  pr-build:
    name: Build ${{ matrix.name }} image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: vkdocker/stock-brokerage-backend
            file: Dockerfile.backend
          - name: frontend
            image: vkdocker/stock-brokerage-frontend
            file: Dockerfile.frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: version
        shell: bash
        run: |
          echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.image }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish ${{ matrix.name }} image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: vkdocker/stock-brokerage-backend
            file: Dockerfile.backend
          - name: frontend
            image: vkdocker/stock-brokerage-frontend
            file: Dockerfile.frontend
          - name: allinone
            image: vkdocker/stock-brokerage-allinone
            file: Dockerfile.allinone
          - name: allinone-observability
            image: vkdocker/stock-brokerage-allinone-obs
            file: Dockerfile.allinone-obs

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ matrix.image }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
