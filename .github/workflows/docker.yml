name: Docker Images

on:
  pull_request:
    branches: [ main, develop ]
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} image
    if: github.event_name == 'push' || matrix.pull_request
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: vkdocker/stock-brokerage-backend
            file: Dockerfile.backend
            pull_request: true
          - name: frontend
            image: vkdocker/stock-brokerage-frontend
            file: Dockerfile.frontend
            pull_request: true
          - name: allinone
            image: vkdocker/stock-brokerage-allinone
            file: Dockerfile.allinone
            pull_request: false
          - name: allinone-observability
            image: vkdocker/stock-brokerage-allinone-obs
            file: Dockerfile.allinone-obs
            pull_request: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ matrix.image }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
